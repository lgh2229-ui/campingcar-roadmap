name: Hotfix home syntax

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix extra closing parenthesis
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('lib/screens/home_screen.dart')
          s = p.read_text()
          old = "    ))));\n  }\n\n  Future<void> _openReview(Place p) async {"
          new = "    )));\n  }\n\n  Future<void> _openReview(Place p) async {"
          if old not in s:
              print('Hotfix already applied or target not found.')
          else:
              p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit hotfix if needed
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/screens/home_screen.dart
          git commit -m "Fix review comments sheet syntax"
          git push

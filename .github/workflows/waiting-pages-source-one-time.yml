name: Set customer status Pages source (one-time)
on:
  push:
    branches: [waiting-android]
    paths:
      - '.github/workflows/waiting-pages-source-one-time.yml'
permissions:
  contents: read
  pages: write
jobs:
  configure:
    runs-on: ubuntu-latest
    steps:
      - name: Switch Pages source to isolated waiting branch docs without touching main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          response=$(mktemp)
          status=$(curl --silent --show-error --max-time 15 --output "$response" --write-out '%{http_code}' \
            --request PUT \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data '{"build_type":"legacy","source":{"branch":"waiting-android","path":"/docs"}}' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pages")
          echo "Pages source configuration HTTP status: $status"
          if [ "$status" = 204 ] || [ "$status" = 200 ]; then
            echo "PASS: Pages source set to waiting-android /docs"
          else
            echo "Pages source requires repo administrator permissions via repository Settings → Pages."
          fi

name: Read Solapi waiting call template catalog
on:
  push:
    branches: [waiting-android]
    paths:
      - '.github/workflows/waiting-call-template-check.yml'
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Read template list from live Solapi credentials
        run: |
          set -euo pipefail
          curl --silent --fail --show-error --max-time 20 'https://xlpwxkcxpxorrmkgzhft.supabase.co/functions/v1/waiting-call-template-readonly-1117' | python3 -m json.tool

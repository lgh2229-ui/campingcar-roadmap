name: Build Waiting Kiosk 2.6 Lenovo Power Shortcut
on:
  push:
    branches: [waiting-android]
    paths:
      - '.github/workflows/waiting-kiosk-v26.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore verified same update signing certificate
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "${ANDROID_DEBUG_KEYSTORE_BASE64:-}"
          mkdir -p "$HOME/.android"
          printf '%s' "$ANDROID_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          fingerprint=$(keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey 2>/dev/null | awk -F'SHA256:' '/SHA256:/{gsub(/[: ]/,"",$2);print toupper($2);exit}')
          test "$fingerprint" = "E2BD19B77B905D522D57FC9DB1D9FBD7A1BEA9E04990A9DDEDF89D2C3A8B0361"
      - name: Verify Lenovo system shortcut cannot falsely claim to set RTC schedule
        run: |
          python3 - <<'PY'
          from pathlib import Path
          j=Path("waiting-android/app/src/main/java/kr/co/waitingprogram/pos/MainActivity.java").read_text()
          h=Path("waiting-android/app/src/main/assets/index.html").read_text()
          g=Path("waiting-android/app/build.gradle").read_text()
          for needle in ("@JavascriptInterface","openScheduledPowerSettings","Settings.ACTION_SETTINGS","runOnUiThread"):
              assert needle in j,needle
          for needle in ("onclick=\"openTabletPowerSettings()\"","window.WaitingTabletPower","⚙ 자동 전원"):
              assert needle in h,needle
          assert "versionCode 8" in g and "versionName '2.6'" in g
          assert "FLAG_KEEP_SCREEN_ON" in j
          print("PASS Lenovo shortcut; old customer kiosk and persistent screen-on preserved")
          PY
      - name: Build APK
        run: gradle --no-daemon -p waiting-android :app:assembleDebug
      - name: Confirm APK identity and exact previous signing key
        run: |
          set -euo pipefail
          apk=waiting-android/app/build/outputs/apk/debug/app-debug.apk
          aapt=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)
          signer=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          "$aapt" dump badging "$apk" | grep -F "package: name='kr.co.waitingprogram.kiosk' versionCode='8' versionName='2.6'"
          "$aapt" dump badging "$apk" | grep -F "sdkVersion:'23'"
          "$signer" verify --verbose --print-certs "$apk" | tee /tmp/sign-verify.log
          grep -F 'Verified using v1 scheme' /tmp/sign-verify.log
          actual=$(grep -i 'certificate SHA-256 digest' /tmp/sign-verify.log | head -1 | sed 's/.*: //' | tr -d ':' | tr '[:lower:]' '[:upper:]')
          test "$actual" = "E2BD19B77B905D522D57FC9DB1D9FBD7A1BEA9E04990A9DDEDF89D2C3A8B0361"
          cp "$apk" waiting-kiosk-lenovo-power-v2.6.apk
      - uses: actions/upload-artifact@v4
        with:
          name: waiting-kiosk-lenovo-power-v2.6-apk
          path: waiting-kiosk-lenovo-power-v2.6.apk
          retention-days: 30

name: Build Waiting Customer APK
on:
  push:
    branches: [waiting-android]
    paths:
      - 'waiting-android/**'
      - '.github/workflows/waiting-pos-apk.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore the same persistent Android signing key for every release
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$ANDROID_DEBUG_KEYSTORE_BASE64" ]; then
            echo "ERROR: persistent signing secret missing. Refusing unsigned/rotating-key APK."
            exit 1
          fi
          mkdir -p "$HOME/.android"
          printf '%s' "$ANDROID_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          EXPECTED_SHA256="E2BD19B77B905D522D57FC9DB1D9FBD7A1BEA9E04990A9DDEDF89D2C3A8B0361"
          ACTUAL_SHA256=$(keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey 2>/dev/null | awk -F'SHA256:' '/SHA256:/{gsub(/[: ]/,"",$2); print toupper($2); exit}')
          if [ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]; then
            echo "ERROR: signing key has changed. Refusing to build."
            exit 1
          fi
      - name: Build installable APK
        run: gradle --no-daemon -p waiting-android :app:assembleDebug
      - name: Verify real APK package and persistent signing certificate
        run: |
          set -euo pipefail
          APK="waiting-android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          test -n "$AAPT" && test -n "$APKSIGNER"
          "$AAPT" dump badging "$APK" | head -12
          "$AAPT" dump badging "$APK" | grep -F "package: name='kr.co.waitingprogram.kiosk'"
          "$AAPT" dump badging "$APK" | grep -F "sdkVersion:'23'"
          CERTS=$("$APKSIGNER" verify --verbose --print-certs "$APK")
          echo "$CERTS" | grep -F "Verified using v1 scheme"
          ACTUAL_SHA256=$(printf '%s\n' "$CERTS" | grep -i 'certificate SHA-256 digest' | head -1 | sed 's/.*: //' | tr -d ':' | tr '[:lower:]' '[:upper:]')
          EXPECTED_SHA256="E2BD19B77B905D522D57FC9DB1D9FBD7A1BEA9E04990A9DDEDF89D2C3A8B0361"
          if [ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]; then
            echo "ERROR: final APK not signed by persistent test certificate"
            exit 1
          fi
          cp "$APK" waiting-customer-install-fixed-v2.apk
          sha256sum waiting-customer-install-fixed-v2.apk
      - name: Enable hardware acceleration for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and launch on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          script: |
            adb install -r waiting-customer-install-fixed-v2.apk
            adb shell am start -n kr.co.waitingprogram.kiosk/kr.co.waitingprogram.pos.MainActivity
            sleep 5
            adb shell pidof kr.co.waitingprogram.kiosk
      - name: Upload only tested APK
        uses: actions/upload-artifact@v4
        with:
          name: waiting-customer-install-fixed-v2-apk
          path: waiting-customer-install-fixed-v2.apk
          retention-days: 30

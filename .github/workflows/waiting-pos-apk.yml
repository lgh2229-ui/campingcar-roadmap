name: Build Waiting POS APK
on:
  push:
    branches: [waiting-android]
    paths:
      - 'waiting-android/**'
      - '.github/workflows/waiting-pos-apk.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Check Android SDK availability
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true
          ls "$ANDROID_HOME/build-tools" || true
      - name: Build installable APK (Android 6.0+)
        run: gradle --no-daemon -p waiting-android :app:assembleDebug
      - name: Check APK
        run: |
          test -s waiting-android/app/build/outputs/apk/debug/app-debug.apk
          sha256sum waiting-android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: waiting-pos-v1-android6-apk
          path: waiting-android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
name: Build Waiting Customer APK
on:
  push:
    branches: [waiting-android]
    paths:
      - 'waiting-android/**'
      - '.github/workflows/waiting-pos-apk.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore the same persistent Android signing key for every release
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$ANDROID_DEBUG_KEYSTORE_BASE64" ]; then
            echo "ERROR: persistent signing secret missing. Refusing unsigned/rotating-key APK."
            exit 1
          fi
          mkdir -p "$HOME/.android"
          printf '%s' "$ANDROID_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          EXPECTED_SHA256="E2BD19B77B905D522D57FC9DB1D9FBD7A1BEA9E04990A9DDEDF89D2C3A8B0361"
          ACTUAL_SHA256=$(keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey 2>/dev/null | awk -F'SHA256:' '/SHA256:/{gsub(/[: ]/,"",$2); print toupper($2); exit}')
          if [ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]; then
            echo "ERROR: signing key has changed. Refusing to build."
            exit 1
          fi
      - name: Validate kiosk login screen and JavaScript
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const html = fs.readFileSync('waiting-android/app/src/main/assets/index.html','utf8');
          const script = html.match(/<script>([\s\S]*?)<\/script>/);
          if (!script) throw Error('Kiosk JavaScript missing');
          new Function(script[1]);
          for (const required of ['waiting_kiosk_login_v3','loginStore()','storeIdentifier','headerId','savedStoreName','currentWaitingCount']) {
            if (!html.includes(required)) throw Error('Missing kiosk login feature: '+required);
          }
          console.log('Kiosk login and JavaScript syntax verified');
          NODE
      - name: Test cold-start store confirmation and persisted identity
        run: |
          node <<'NODE'
          const fs=require('node:fs'),vm=require('node:vm'),assert=require('node:assert/strict');
          const html=fs.readFileSync('waiting-android/app/src/main/assets/index.html','utf8');
          const script=html.split('<script>')[1].split('</script>')[0];
          function boot(value){
            const nodes=new Map(), data=new Map();
            if(value)data.set('waiting_kiosk_login_v3',JSON.stringify(value));
            const node=id=>{
              if(!nodes.has(id)){
                const classes=new Set(['hide']);
                nodes.set(id,{id,classList:{
                  add:(x)=>classes.add(x),remove:(x)=>classes.delete(x),contains:(x)=>classes.has(x)
                },style:{},textContent:'',innerHTML:'',value:'',checked:false,disabled:false,
                scrollHeight:390,offsetHeight:390});
              }
              return nodes.get(id);
            };
            const ctx={console,Date,encodeURIComponent,clearInterval:()=>{},
              setTimeout:()=>0,setInterval:()=>0,
              localStorage:{getItem:k=>data.has(k)?data.get(k):null,setItem:(k,v)=>data.set(k,v),removeItem:k=>data.delete(k)},
              document:{getElementById:node,documentElement:{clientWidth:420,clientHeight:900},addEventListener:()=>{}},
              window:{innerWidth:420,innerHeight:900,addEventListener:()=>{}},
              XMLHttpRequest:class{
                open(method,url){this.url=url;}setRequestHeader(){}
                send(){
                  const count=this.url.includes('starbam')?2:7;
                  this.responseText=JSON.stringify({registration_open:true,active_waiting_count:count});this.status=200;this.readyState=4;
                  if(this.onreadystatechange)this.onreadystatechange();
                }
              }
            };
            vm.createContext(ctx);vm.runInContext(script,ctx);
            return {ctx,node,data};
          }
          const saved={store:'dowon',identifier:'도원부산양곱창',name:'도원부산양곱창',loginAt:123};
          const initial=boot(saved);
          assert.equal(initial.ctx.store,'','cold start must not automatically select store');
          assert.equal(initial.node('setup').classList.contains('hide'),false,'confirmation must be visible');
          assert.equal(initial.node('form').classList.contains('hide'),true,'registration form must be blocked');
          assert.equal(initial.node('savedStoreConfirm').classList.contains('hide'),false);
          assert.equal(initial.node('savedStoreName').textContent,'도원부산양곱창');
          assert.equal(initial.node('savedStoreIdentifier').textContent,'식별자 · 도원부산양곱창');
          initial.ctx.confirmSavedStore();
          assert.equal(initial.ctx.store,'dowon');
          assert.equal(initial.node('form').classList.contains('hide'),false);
          assert.equal(initial.node('currentWaitingCount').textContent,'7');
          assert.equal(initial.node('waitingCountHint').textContent,'대기 및 호출 중 · 30초마다 갱신');
          assert.equal(initial.node('headerName').textContent,'도원부산양곱창');
          assert.equal(initial.node('headerId').textContent,'전화번호와 방문 인원만 입력하면 접수됩니다.');
          assert.equal(initial.node('headerId').textContent.includes('도원부산양곱창'),false);
          assert.equal(html.includes('id="formName"'),false);
          assert.equal(html.includes('id="storeIdentity"'),false);
          initial.ctx.changeSavedStore();
          assert.equal(initial.node('storeLoginForm').classList.contains('hide'),false);
          assert.equal(initial.node('setup').classList.contains('hide'),false);
          initial.node('storeIdentifier').value='starbam';
          initial.ctx.loginStore();
          assert.equal(initial.ctx.store,'starbam');
          assert.equal(JSON.parse(initial.data.get('waiting_kiosk_login_v3')).store,'starbam');
          const reopened=boot(JSON.parse(initial.data.get('waiting_kiosk_login_v3')));
          assert.equal(reopened.ctx.store,'','a changed saved store must be re-confirmed next cold launch');
          assert.equal(reopened.node('savedStoreName').textContent,'별밤포차');
          reopened.ctx.confirmSavedStore();
          assert.equal(reopened.ctx.store,'starbam');
          assert.equal(reopened.node('currentWaitingCount').textContent,'2');
          const fresh=boot(null);
          assert.equal(fresh.node('setup').classList.contains('hide'),false);
          assert.equal(fresh.node('storeLoginForm').classList.contains('hide'),false);
          assert.equal(fresh.node('form').classList.contains('hide'),true);
          console.log('PASS: saved store requires a tap on every cold launch; switching and first launch work');
          NODE

      - name: Verify live waiting-team count endpoint for both stores
        run: |
          python3 - <<'PY'
          import json
          from urllib.request import urlopen
          for slug in ('dowon','starbam'):
              url=f'https://xlpwxkcxpxorrmkgzhft.supabase.co/functions/v1/restaurant-waiting-status?store={slug}'
              with urlopen(url, timeout=15) as response:
                  value=json.load(response)
              count=value.get('active_waiting_count')
              assert type(count) is int and count >= 0, (slug, value)
              assert isinstance(value.get('registration_open'),bool), (slug, value)
              assert value.get('store')==slug, (slug, value)
              print(f'PASS: {slug} currently {count} active waiting/called teams')
          PY
      - name: Check customer waiting-team card remains prominent
        run: |
          node <<'NODE'
          const fs=require('node:fs'),assert=require('node:assert/strict');
          const html=fs.readFileSync('waiting-android/app/src/main/assets/index.html','utf8');
          assert(html.includes('waiting-summary-title">현재 대기팀'));
          assert(html.includes('id="currentWaitingCount"'));
          assert(html.indexOf('id="currentWaitingCount"')<html.indexOf('class="grid"'));
          assert(html.includes('readTicket();status();startTimer()'));
          assert(html.includes('visibilitychange'));
          assert(html.includes('setInterval(function(){if(store)status()},30000)'));
          console.log('PASS: prominent waiting-team card updates after registration and on refresh');
          NODE
      - name: Verify a single visible store name in registration layout
        run: |
          node <<'NODE'
          const fs=require('node:fs'),assert=require('node:assert/strict');
          const html=fs.readFileSync('waiting-android/app/src/main/assets/index.html','utf8');
          const header=html.slice(html.indexOf('<header>'),html.indexOf('</header>')+9);
          const registration=html.slice(html.indexOf('<section id="form"'),html.indexOf('<section id="success"'));
          assert(header.includes('id="headerName"'));
          assert(!header.includes('식별자 ·'));
          assert(!registration.includes('id="formName"'));
          assert(!registration.includes('id="storeIdentity"'));
          assert(!registration.includes('상호명'));
          assert(registration.includes('waiting-summary-title">현재 대기팀'));
          assert(html.includes("e('headerId').textContent='전화번호와 방문 인원만 입력하면 접수됩니다.'"));
          console.log('PASS: store name shown only in header on registration; waiting count preserved');
          NODE
      - name: Build installable APK
        run: gradle --no-daemon -p waiting-android :app:assembleDebug
      - name: Verify real APK package and persistent signing certificate
        run: |
          set -euo pipefail
          APK="waiting-android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          test -n "$AAPT" && test -n "$APKSIGNER"
          "$AAPT" dump badging "$APK" | head -12
          "$AAPT" dump badging "$APK" | grep -F "package: name='kr.co.waitingprogram.kiosk'"
          "$AAPT" dump badging "$APK" | grep -F "sdkVersion:'23'"
          CERTS=$("$APKSIGNER" verify --verbose --print-certs "$APK")
          echo "$CERTS" | grep -F "Verified using v1 scheme"
          ACTUAL_SHA256=$(printf '%s\n' "$CERTS" | grep -i 'certificate SHA-256 digest' | head -1 | sed 's/.*: //' | tr -d ':' | tr '[:lower:]' '[:upper:]')
          EXPECTED_SHA256="E2BD19B77B905D522D57FC9DB1D9FBD7A1BEA9E04990A9DDEDF89D2C3A8B0361"
          if [ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]; then
            echo "ERROR: final APK not signed by persistent test certificate"
            exit 1
          fi
          cp "$APK" waiting-customer-clean-title-v2.4.apk
          sha256sum waiting-customer-clean-title-v2.4.apk
      - name: Enable hardware acceleration for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and launch on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          script: |
            adb install -r waiting-customer-clean-title-v2.4.apk
            adb shell am start -n kr.co.waitingprogram.kiosk/kr.co.waitingprogram.pos.MainActivity
            sleep 5
            adb shell pidof kr.co.waitingprogram.kiosk
      - name: Upload only tested APK
        uses: actions/upload-artifact@v4
        with:
          name: waiting-customer-clean-title-v2.4-apk
          path: waiting-customer-clean-title-v2.4.apk
          retention-days: 30

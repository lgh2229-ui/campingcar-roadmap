name: Build Waiting Customer APK
on:
  push:
    branches: [waiting-android]
    paths:
      - 'waiting-android/**'
      - '.github/workflows/waiting-pos-apk.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build installable Android 6+ customer APK
        run: gradle --no-daemon -p waiting-android :app:assembleDebug
      - name: Verify installable APK
        run: |
          test -s waiting-android/app/build/outputs/apk/debug/app-debug.apk
          cp waiting-android/app/build/outputs/apk/debug/app-debug.apk waiting-customer-v1.apk
          sha256sum waiting-customer-v1.apk
      - uses: actions/upload-artifact@v4
        with:
          name: waiting-customer-registration-v1-apk
          path: waiting-customer-v1.apk
          retention-days: 30
name: One-time waiting cancellation page QA
on:
  push:
    branches: [waiting-android]
    paths:
      - '.github/workflows/waiting-cancel-page-qa-once.yml'
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Validate live cancellation page JavaScript and safety
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 20 'https://xlpwxkcxpxorrmkgzhft.supabase.co/functions/v1/waiting-my-status' -o waiting-page.html
          node <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('waiting-page.html','utf8');
          const match = html.match(/<script>([\\s\\S]*?)<\\/script>/);
          if(!match) throw Error('Missing JS');
          new Function(match[1]);
          for (const s of ['#([tc])=', 'cancelBanner', 'cancelMode', '이 대기번호 취소하기', '대기순서를 복구할 수 없습니다.', 'request("cancel"']) {
            if (!html.includes(s)) throw Error('Missing cancellation feature '+s);
          }
          const prefix='https://xlpwxkcxpxorrmkgzhft.supabase.co/functions/v1/waiting-my-status#c=';
          if(prefix.length + 24 > 100)throw Error('Provider link exceeds 100 characters');
          console.log('PASS: live cancellation page, confirmation flow and URL length');
          NODE

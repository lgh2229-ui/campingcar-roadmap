name: Request review of new waiting cancellation template
on:
  push:
    branches: [waiting-android]
    paths:
      - '.github/workflows/waiting-cancel-review-once.yml'
jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - name: Request inspection with structured errors
        run: |
          set -euo pipefail
          curl --silent --show-error --max-time 30 --request POST 'https://xlpwxkcxpxorrmkgzhft.supabase.co/functions/v1/waiting-review-cancel-template-20261117' | python3 -m json.tool

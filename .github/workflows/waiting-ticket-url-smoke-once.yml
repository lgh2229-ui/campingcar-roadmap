name: Verify customer ticket link safe fallback
on:
  push:
    branches: [waiting-android]
    paths: ['.github/workflows/waiting-ticket-url-smoke-once.yml']
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify existing Kakao URL no longer renders raw HTML
        run: |
          set -euo pipefail
          curl -sS --max-time 15 -D /tmp/hdr -o /tmp/body 'https://xlpwxkcxpxorrmkgzhft.supabase.co/functions/v1/waiting-my-status'
          python3 - <<'PY'
          from pathlib import Path
          h=Path('/tmp/hdr').read_text().lower()
          s=Path('/tmp/body').read_text()
          assert ('200' in h.splitlines()[0] or '302' in h.splitlines()[0]), h[:400]
          if '302' in h.splitlines()[0]:
              assert 'location: https://lgh2229-ui.github.io/campingcar-roadmap/' in h,h[:700]
          else:
              assert 'content-type: text/plain' in h,h[:700]
              assert '대기현황 페이지를 점검 중입니다' in s,s[:300]
              assert '<!doctype html>' not in s
          print('PASS: current Kakao URL returns safe notice or redirect, not raw HTML')
          PY

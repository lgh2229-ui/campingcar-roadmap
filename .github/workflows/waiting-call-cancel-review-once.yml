name: Submit call cancellation Kakao review
on:
  push:
    branches: [waiting-android]
    paths:
      - '.github/workflows/waiting-call-cancel-review-once.yml'
jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - name: Request review
        run: |
          set -euo pipefail
          curl --silent --show-error --max-time 35 -X POST 'https://xlpwxkcxpxorrmkgzhft.supabase.co/functions/v1/waiting-call-cancel-template-review-1117' | python3 -m json.tool

name: Build Android Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test-and-build-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Run actions/checkout@v4
        uses: actions/checkout@v4
      - name: Patch review comments method
        run: python tool/fix_home_review_comments.py
      - name: Patch place registration screen
        run: python tool/fix_place_registration.py
      - name: Patch personal info edit flow
        run: python tool/fix_profile_edit.py
      - name: Patch map visibility, favorite UI, and admin safe area
        run: python tool/fix_map_visibility_save_safearea.py
      - name: Patch duplicate address change-request flow
        run: python tool/fix_change_request_flow.py
      - name: Patch reports and admin-only place editing
        run: python tool/add_reports_and_admin_edit.py
      - name: Patch favorite detail-sheet state
        run: python tool/fix_favorite_sheet_state.py
      - name: Show service availability and prices
        run: python tool/show_service_prices.py
      - name: Refresh map immediately after admin approval
        run: python tool/fix_admin_approval_refresh.py
      - name: Add AND multi-select filters with correct reset behavior and move admin button
        run: python tool/fix_map_price_service_filter.py
      - name: Show all service icons on map markers
        run: python tool/fix_map_marker_all_service_icons.py
      - name: Apply requested redesign and service details
        run: python tool/apply_requested_redesign.py
      - name: Add AdMob test ads and production ID configuration
        run: python tool/add_admob_ads.py
      - name: Apply market, feedback, and admin support features
        run: python tool/apply_market_support_features.py
      - name: Fix release startup and add current location marker
        run: python tool/fix_release_startup_and_location.py
      - name: Preserve selected photos and add edit cancel
        run: python tool/fix_photo_append_and_edit_cancel.py
      - name: Apply metadata, photo controls, and admin improvements
        run: python tool/apply_metadata_photo_admin_improvements.py
      - name: Add place report photos and zoom viewer
        run: python tool/add_place_report_photos.py
      - name: Run subosito/flutter-action@v2
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform files
        run: flutter create . --platforms=android --org kr.co.campingcarroadmap --project-name campingcar_roadmap
      - name: Remove generated default widget test
        run: rm -f test/widget_test.dart
      - name: Prepare Android permissions, AdMob, and API 36
        run: python tool/prepare_android.py
      - name: Verify AdMob manifest wiring
        run: |
          echo "=== pubspec AdMob ==="
          grep -n 'google_mobile_ads' pubspec.yaml || true
          echo "=== AndroidManifest AdMob ==="
          grep -n -A3 -B2 'com.google.android.gms.ads.APPLICATION_ID' android/app/src/main/AndroidManifest.xml || true
          if grep -q 'google_mobile_ads:' pubspec.yaml; then
            grep -q 'com.google.android.gms.ads.APPLICATION_ID' android/app/src/main/AndroidManifest.xml || (echo "FATAL: AdMob dependency enabled but APPLICATION_ID missing" && exit 1)
          fi
      - name: Configure Firebase Android
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON_BASE64" ]; then echo "Missing GOOGLE_SERVICES_JSON_BASE64"; exit 1; fi
          echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android/app/google-services.json
          python tool/configure_firebase_android.py
      - name: Verify permanent application ID
        run: |
          if ! grep -q 'applicationId = "kr.co.campingcarroadmap.app"' android/app/build.gradle.kts; then exit 1; fi
      - name: Restore persistent debug signing key
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$HOME/.android"
          if [ -n "$ANDROID_DEBUG_KEYSTORE_BASE64" ]; then echo "$ANDROID_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"; else exit 1; fi
          EXPECTED_SHA256="E2BD19B77B905D522D57FC9DB1D9FBD7A1BEA9E04990A9DDEDF89D2C3A8B0361"
          ACTUAL_SHA256=$(keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey 2>/dev/null | awk -F'SHA256:' '/SHA256:/{gsub(/[: ]/,"",$2); print toupper($2); exit}')
          if [ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]; then exit 1; fi
      - name: Get packages
        run: flutter pub get
      - name: Run tests
        run: flutter test
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Verify Supabase build configuration
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_PUBLISHABLE_KEY" ]; then exit 1; fi
      - name: Build debug APK
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: >
          flutter build apk --debug
          --dart-define=SUPABASE_URL="$SUPABASE_URL"
          --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY"
      - name: Build release APK for Play-equivalent startup test
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || (echo "Missing release keystore" && exit 1)
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF
          python tool/configure_release_signing.py
          flutter build apk --release --dart-define=SUPABASE_URL="$SUPABASE_URL" --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY"
      - name: Upload release APK for device validation
        uses: actions/upload-artifact@v4
        with:
          name: campingcar-roadmap-1.9.18-111-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
      - name: Verify final APK signer
        run: |
          EXPECTED_SHA256="E2BD19B77B905D522D57FC9DB1D9FBD7A1BEA9E04990A9DDEDF89D2C3A8B0361"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          CERTS=$($APKSIGNER verify --verbose --print-certs build/app/outputs/flutter-apk/app-debug.apk)
          ACTUAL_SHA256=$(printf '%s\n' "$CERTS" | grep -i 'certificate SHA-256 digest' | head -1 | sed 's/.*: //' | tr -d ':' | tr '[:lower:]' '[:upper:]')
          if [ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]; then exit 1; fi
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: campingcar-roadmap-market-v2-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk

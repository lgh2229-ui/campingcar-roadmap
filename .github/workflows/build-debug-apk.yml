name: Build Android Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test-and-build-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Run actions/checkout@v4
        uses: actions/checkout@v4

      - name: Patch review comments method
        run: python tool/fix_home_review_comments.py

      - name: Run subosito/flutter-action@v2
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform files
        run: flutter create . --platforms=android --org kr.co.campingcarroadmap --project-name campingcar_roadmap

      - name: Remove generated default widget test
        run: rm -f test/widget_test.dart

      - name: Prepare Android permissions and API 36
        run: python tool/prepare_android.py

      - name: Restore persistent debug signing key
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$HOME/.android"
          if [ -n "$ANDROID_DEBUG_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
            echo "Using persistent repository debug signing key."
          else
            echo "ANDROID_DEBUG_KEYSTORE_BASE64 secret is not configured."
            exit 1
          fi

      - name: Get packages
        run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build debug APK
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: >
          flutter build apk --debug
          --dart-define=SUPABASE_URL="$SUPABASE_URL"
          --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: campingcar-roadmap-v1.9.0-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk

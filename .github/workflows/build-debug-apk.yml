name: Build Android Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test-and-build-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Run actions/checkout@v4
        uses: actions/checkout@v4

      - name: Patch review comments method
        run: python tool/fix_home_review_comments.py

      - name: Run subosito/flutter-action@v2
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform files
        run: flutter create . --platforms=android --org kr.co.campingcarroadmap --project-name campingcar_roadmap

      - name: Remove generated default widget test
        run: rm -f test/widget_test.dart

      - name: Prepare Android permissions and API 36
        run: python tool/prepare_android.py

      - name: Verify permanent application ID
        run: |
          if ! grep -q 'applicationId = "kr.co.campingcarroadmap.app"' android/app/build.gradle.kts; then
            echo "Unexpected Android applicationId. Refusing to build an incompatible APK."
            exit 1
          fi
          echo "Android applicationId is locked to kr.co.campingcarroadmap.app"

      - name: Restore persistent debug signing key
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$HOME/.android"
          if [ -n "$ANDROID_DEBUG_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          else
            echo "ANDROID_DEBUG_KEYSTORE_BASE64 secret is not configured."
            exit 1
          fi

          # Lock builds to the persistent repository signing key currently stored
          # in ANDROID_DEBUG_KEYSTORE_BASE64. This is the certificate that future
          # builds must keep using so update installs remain compatible.
          EXPECTED_SHA256="E2BD19B77B905D522D57FC9DB1D9FBD7A1BEA9E04990A9DDEDF89D2C3A8B0361"
          ACTUAL_SHA256=$(keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey 2>/dev/null | awk -F'SHA256:' '/SHA256:/{gsub(/[: ]/,"",$2); print toupper($2); exit}')
          if [ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]; then
            echo "Signing certificate changed. Refusing to build an APK that cannot update the installed app."
            echo "Expected: $EXPECTED_SHA256"
            echo "Actual:   $ACTUAL_SHA256"
            exit 1
          fi
          echo "Signing certificate fingerprint verified."

      - name: Get packages
        run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Verify Supabase build configuration
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ]; then
            echo "SUPABASE_URL secret is missing."
            exit 1
          fi
          if [ -z "$SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "SUPABASE_PUBLISHABLE_KEY secret is missing."
            exit 1
          fi
          echo "Supabase build configuration is present."

      - name: Build debug APK
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: >
          flutter build apk --debug
          --dart-define=SUPABASE_URL="$SUPABASE_URL"
          --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: campingcar-roadmap-v1.9.5-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk

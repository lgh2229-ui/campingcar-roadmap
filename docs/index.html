<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer"><meta name="robots" content="noindex,nofollow,noarchive">
<title>내 대기현황 - 웨이팅</title>
<style>
*{box-sizing:border-box}
html,body{min-height:100%;margin:0}
body{background:#f3f6fa;font-family:system-ui,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:#22374a}
main{max-width:515px;margin:0 auto;padding:20px 16px 38px}
header{text-align:center;padding:21px 6px 24px}header .top{font-size:13px;color:#7a90a4;letter-spacing:2px;font-weight:750}
h1{font-size:27px;margin:11px 0 0}h2{margin:0;font-size:21px}
.card{background:#fff;border:1px solid #e1e8f0;border-radius:21px;padding:29px 22px;box-shadow:0 4px 20px #122b4709}
.badge{background:#e7f3ff;color:#145f98;border-radius:50px;display:inline-block;padding:9px 17px;font-size:14px;font-weight:750}
.center{text-align:center}
.num{font-size:98px;color:#146ca8;font-weight:900;line-height:1.3;font-variant-numeric:tabular-nums}
.num small{font-size:32px}
.metrics{display:flex;gap:12px;margin:20px 0}
.metric{flex:1;text-align:center;background:#eef6ff;border-radius:13px;padding:17px 8px}
.metric strong{font-size:32px;display:block;color:#1a5d91}.metric span{font-size:13px;color:#657c8e}
.state{background:#eaf3fc;padding:17px 11px;text-align:center;border-radius:11px;font-size:20px;font-weight:750}
.state.called{background:#e6f9eb;color:#0b7242}.state.done{background:#eff1f4;color:#5a6c7b}
button{width:100%;border:0;border-radius:12px;min-height:56px;font-size:18px;font-weight:750;cursor:pointer;margin-top:13px}
.refresh{background:#146ca8;color:white}.cancel{background:#fff;color:#aa413b;border:1px solid #d9b3b0}
.cancel.cancel-action{background:#a52b37;color:#fff;border:1px solid #a52b37}
.cancel-banner{border:1px solid #f3c3c4;background:#fff5f5;color:#8b2630;padding:17px;border-radius:14px;margin-bottom:12px;font-size:16px;line-height:1.6}
.cancel-banner strong{display:block;font-size:19px;margin-bottom:3px}
button:disabled{opacity:.45}
.info{font-size:14px;text-align:center;color:#708293;margin:17px 0 5px}
.message{border-radius:13px;background:white;border:1px solid #dce6ee;padding:23px 17px;line-height:1.65}
.error{border-radius:11px;padding:13px 15px;background:#fff0e8;color:#9d4434;font-size:14px;margin-top:14px;line-height:1.5}
.hide{display:none!important}
footer{font-size:12px;text-align:center;color:#9daebb;margin:23px 0}
</style></head><body>
<main><header><div class="top">WAITING STATUS</div><h1 id="store">내 대기현황</h1></header>
<div id="loading" class="message">대기현황을 조회하고 있습니다.</div>
<div id="error" class="message hide" role="alert"></div>
<div id="cancelBanner" class="cancel-banner hide"><strong>웨이팅 취소하기</strong>취소할 대기번호와 방문 인원을 확인한 후 아래에서 취소를 확정해 주세요. 취소하면 대기순서는 복구되지 않습니다.</div>
<section id="card" class="card hide">
 <div class="center"><div class="badge">나의 대기번호</div><div id="number" class="num">—</div></div>
 <div class="metrics"><div class="metric"><strong id="ahead">—</strong><span>앞에 남은 대기팀</span></div><div class="metric"><strong id="party">—</strong><span>방문 인원</span></div></div>
 <div id="state" class="state">대기 중</div>
 <button id="refresh" type="button" class="refresh">대기현황 새로고침</button>
 <button id="cancel" type="button" class="cancel">웨이팅 취소</button>
 <div class="info">10초마다 자동 갱신 · 예상 대기시간 미표시</div>
 <div id="errorAction" class="error hide" role="alert"></div>
</section>
<footer>매장 전용 웨이팅 서비스 · 링크를 다른 사람에게 공유하지 마세요.</footer>
</main>
<script>
(function(){
 "use strict";
 var tokenMatch=(location.hash||"").match(/^#([tc])=([0-9a-f]{24}|[0-9a-f]{64})$/i);
 var cancelMode=!!tokenMatch&&tokenMatch[1]==="c";
 var token=tokenMatch?tokenMatch[2]:"";
 var busy=false;
 var currentStatus="";
 var api="/functions/v1/restaurant-waiting-ticket";
 function el(id){return document.getElementById(id)}
 function show(id){el(id).classList.remove("hide")}
 function hide(id){el(id).classList.add("hide")}
 function problem(msg){el("error").textContent=msg;hide("loading");hide("card");show("error")}
 function request(action, cb){
  var xhr=new XMLHttpRequest();
  xhr.open("POST",api,true);
  xhr.timeout=14000;
  xhr.setRequestHeader("Content-Type","application/json");
  xhr.onreadystatechange=function(){
   if(xhr.readyState!==4)return;
   var obj={};
   try{obj=JSON.parse(xhr.responseText||"{}")}catch(e){}
   if(xhr.status>=200&&xhr.status<300)cb(null,obj);
   else cb(obj.error||"NETWORK_ERROR",obj);
  };
  xhr.onerror=function(){cb("NETWORK_ERROR",{})};
  xhr.ontimeout=function(){cb("TIMEOUT",{})};
  xhr.send(JSON.stringify({action:action,token:token}));
 }
 function stateText(x){return {
  waiting:"현재 대기 중",called:"호출되었습니다. 매장으로 와 주세요.",
  seated:"입장 완료",cancelled:"취소 완료",no_show:"미방문 처리"
 }[x]||"상태 확인 중"}
 function render(d){
  currentStatus=d.status||"";
  el("store").textContent=d.store_name||"내 대기현황";
  el("number").textContent=String(d.queue_number)+"번";
  el("party").textContent=String(d.party_size)+"명";
  el("ahead").textContent=String(d.ahead_count)+"팀";
  var s=el("state");
  s.textContent=stateText(currentStatus);
  s.className="state"+(currentStatus==="called"?" called":(["seated","cancelled","no_show"].indexOf(currentStatus)!==-1?" done":""));
  el("cancel").disabled=["waiting","called"].indexOf(currentStatus)<0;
  if(cancelMode){show("cancelBanner");el("cancel").textContent="이 대기번호 취소하기";el("cancel").classList.add("cancel-action");}
  hide("error");hide("loading");show("card");
 }
 function update(){
  if(busy)return;busy=true;
  request("read",function(err,d){
   busy=false;
   if(err){
    if(!el("card").classList.contains("hide")){
     el("errorAction").textContent="연결 상태를 확인할 수 없습니다. 새로고침해 주세요.";
     show("errorAction");
    } else {
     problem(err==="NOT_FOUND"?"유효하지 않거나 만료된 대기현황 링크입니다.":"대기현황을 불러올 수 없습니다. 잠시 후 다시 시도해 주세요.");
    }
    return;
   }
   hide("errorAction");render(d);
  });
 }
 el("refresh").addEventListener("click",update);
 el("cancel").addEventListener("click",function(){
  if(busy||["waiting","called"].indexOf(currentStatus)<0)return;
  if(!confirm("대기번호 "+el("number").textContent+"을 취소하시겠습니까?\n취소하면 대기순서를 복구할 수 없습니다."))return;
  busy=true;el("cancel").disabled=true;
  request("cancel",function(err,d){
   busy=false;
   if(err||!d.cancelled){
    el("errorAction").textContent="취소를 완료하지 못했습니다. 매장에 문의해 주세요.";
    show("errorAction");el("cancel").disabled=false;return;
   }
   hide("errorAction");hide("cancelBanner");cancelMode=false;update();
  });
 });
 if(!token){problem("유효한 대기현황 링크가 아닙니다. 카카오 알림톡의 버튼을 눌러 접속해 주세요.");return}
 update();
 setInterval(function(){if(!document.hidden)update()},10000);
})();
</script>
</body></html>
